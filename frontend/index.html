<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Data Quality Bot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container {
            max-width: 820px;
            margin: auto;
            text-align: center;
        }
        h1 {
            font-size: 2.4rem;
            color: #60a5fa;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 18px;
            background: #1e2937;
            color: white;
            border: 2px solid #334155;
            border-radius: 16px;
            font-family: monospace;
            font-size: 15px;
            resize: vertical;
            transition: all 0.3s;
        }
        textarea:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.2);
        }
        button {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.4);
        }
        #result {
            margin-top: 30px;
            padding: 35px 25px;
            background: #1e2937;
            border-radius: 20px;
            min-height: 180px;
            animation: fadeIn 0.6s ease-out;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .score {
            font-size: 82px;
            font-weight: 700;
            margin: 10px 0;
            line-height: 1;
            animation: popIn 0.5s ease-out;
        }
        .task {
            font-size: 21px;
            color: #a5b4fc;
            margin: 12px 0;
            font-weight: 500;
        }
        .time {
            color: #94a3b8;
            font-size: 15px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { transform: scale(0.6); }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Axis Data Quality Bot</h1>
        <p class="subtitle">Kiểm tra chất lượng dữ liệu Axis Robotics</p>

        <textarea id="input" placeholder="Dán Transaction Hash (0x...) hoặc JSON trajectory vào đây..."></textarea>
        
        <button onclick="checkQuality()">🚀 Kiểm Tra Ngay</button>

        <div id="result"></div>
    </div>

    <script>
        async function checkQuality() {
            const input = document.getElementById('input').value.trim();
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<p style="color:#94a3b8;">⏳ Đang phân tích...</p>`;

            if (!input) {
                resultDiv.innerHTML = `<p style="color:#f87171;">❌ Vui lòng dán dữ liệu!</p>`;
                return;
            }

            try {
                const res = await fetch('/check', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({trajectory: input})
                });
                const data = await res.json();
                
                const score = data.score;
                const task = data.metrics?.task || "Unknown Task";
                const time = data.metrics?.checked_at || "—";

                const color = score >= 70 ? "#4ade80" : score >= 55 ? "#fbbf24" : "#f87171";

                resultDiv.innerHTML = `
                    <div class="score" style="color: ${color}">${score}</div>
                    <div class="task">${task}</div>
                    <div class="time">Kiểm tra lúc: ${time}</div>
                `;
            } catch (e) {
                resultDiv.innerHTML = `<p style="color:#f87171;">❌ Lỗi kết nối server</p>`;
            }
        }
    </script>
</body>
</html>
